name: Tramo agregado (re-tracking)
# Corre el código real de la app (cifrado) con el motor y el ffmpeg que deja el instalador de verdad, en Windows y Mac
# limpias: alarga un clip ya trackeado de 5 maneras y comprueba que el tramo agregado se trackea solo.
on:
  workflow_dispatch:
    inputs:
      minutos: { description: 'Tope por espera en minutos (-1 = solo el cartel)', default: '20' }
env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
jobs:
  win:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [windows-2022, windows-2025] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Paquete de prueba
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}', CLAVE: '${{ secrets.PRUEBA_CLAVE }}' }
        run: |
          gh release download paquete -p 'win.enc' -p 'datos.enc' -p 'app-tramo.enc' -D p
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in p/win.enc -out setup.exe
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in p/datos.enc -out clip.mp4
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in p/app-tramo.enc -out app.tgz
          tar xzf app.tgz && rm -rf p app.tgz; ls -la setup.exe clip.mp4
      - name: Instalar y abrir la app (prepara el motor sola)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Process .\setup.exe -ArgumentList '/S' -Wait
          $app="$env:LOCALAPPDATA\Programs\Salas Sports\Salas Sports.exe"
          if(!(Test-Path $app)){ throw 'el instalador no dejó la app' }
          Start-Process $app
          $e="$env:APPDATA\boca-va\vision-engine"; $t=Get-Date
          for($i=0;$i -lt 120;$i++){ if(Test-Path "$e\engine.json"){break}; Start-Sleep 3 }
          "motor preparado solo: $(Test-Path "$e\engine.json") a los $([int]((Get-Date)-$t).TotalSeconds) s"
          Start-Sleep 5
          Get-Process 'Salas Sports' -ErrorAction SilentlyContinue | Stop-Process -Force
          if(!(Test-Path "$e\engine.json")){ throw 'la app no preparó el motor' }
      - name: Código nuevo de la app
        shell: bash
        run: |
          R="$LOCALAPPDATA/Programs/Salas Sports/resources/app.asar.unpacked/assets/bin"
          mkdir -p app/assets/bin && cp "$R/ffmpeg.exe" "$R/ffprobe.exe" app/assets/bin/
          cd app && npm ci --ignore-scripts --no-audit --no-fund > /dev/null && node node_modules/electron/install.js && ls node_modules/electron/dist | head -3
      - name: Las 5 rondas
        shell: bash
        run: |
          node ci/preparar-tramo.js ci/t-tramo.js clip.mp4 ${{ inputs.minutos }} "$RUNNER_TEMP/tramo.js"
          cd app
          VA_SMOKE=1 VA_ENGINE_TEST=1 VA_SMOKE_EXTRA="$RUNNER_TEMP/tramo.js" npx electron . > "$RUNNER_TEMP/salida.txt" 2>&1 || true
          cd .. && node ci/informe-tramo.js "$RUNNER_TEMP/salida.txt"
      - name: Registro del motor (si falló)
        if: failure()
        shell: bash
        run: |
          tail -60 "$RUNNER_TEMP/salida.txt" || true
          tail -40 "$APPDATA/boca-va/vision-engine/install.log" || true
  mac:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, pkg: mac-arm64.enc }
          - { os: macos-26, pkg: mac-arm64.enc }
          - { os: macos-15-intel, pkg: mac-x64.enc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Paquete de prueba
        env: { GH_TOKEN: '${{ github.token }}', CLAVE: '${{ secrets.PRUEBA_CLAVE }}' }
        run: |
          gh release download paquete -p '${{ matrix.pkg }}' -p 'datos.enc' -p 'app-tramo.enc' -D p
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in 'p/${{ matrix.pkg }}' -out app.dmg
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in p/datos.enc -out clip.mp4
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:CLAVE -in p/app-tramo.enc -out app.tgz
          tar xzf app.tgz && rm -rf p app.tgz
      - name: Instalar y abrir la app (prepara el motor sola)
        run: |
          sw_vers; uname -m
          hdiutil attach app.dmg -nobrowse -mountpoint /Volumes/salas >/dev/null
          cp -R "/Volumes/salas/Salas Sports.app" /Applications/ && hdiutil detach /Volumes/salas >/dev/null
          E="$HOME/Library/Application Support/boca-va/vision-engine"
          open "/Applications/Salas Sports.app"; T=$(date +%s)
          for i in $(seq 1 120); do [ -f "$E/engine.json" ] && break; sleep 3; done
          echo "motor preparado solo: $([ -f "$E/engine.json" ] && echo SI || echo NO) a los $(( $(date +%s) - T )) s"
          sleep 5; pkill -f "Salas Sports" || true
          [ -f "$E/engine.json" ]
      - name: Código nuevo de la app
        run: |
          R="/Applications/Salas Sports.app/Contents/Resources/app.asar.unpacked/assets/bin"
          mkdir -p app/assets/bin && cp "$R/ffmpeg_macos" "$R/ffprobe_macos" app/assets/bin/
          cd app && npm ci --ignore-scripts --no-audit --no-fund > /dev/null && node node_modules/electron/install.js && ls node_modules/electron/dist | head -3
      - name: Las 5 rondas
        run: |
          node ci/preparar-tramo.js ci/t-tramo.js clip.mp4 ${{ inputs.minutos }} "$RUNNER_TEMP/tramo.js"
          cd app
          VA_SMOKE=1 VA_ENGINE_TEST=1 VA_SMOKE_EXTRA="$RUNNER_TEMP/tramo.js" npx electron . > "$RUNNER_TEMP/salida.txt" 2>&1 || true
          cd .. && node ci/informe-tramo.js "$RUNNER_TEMP/salida.txt"
      - name: Registro (si falló)
        if: failure()
        run: |
          tail -60 "$RUNNER_TEMP/salida.txt" || true
          tail -40 "$HOME/Library/Application Support/boca-va/vision-engine/install.log" || true
